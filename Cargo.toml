[workspace]
resolver = "2"
members = [
    "crates/mesh-core",
    "crates/mesh-attributes",
    "crates/mesh-analysis",
    "crates/mesh-repair",
    "crates/mesh-validation",
    "crates/mesh-formats",
    "crates/mesh-cli",
    "crates/mesh-desktop",
    "crates/mesh-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jcgit1/rsSTLRepair"
authors = ["rsSTLRepair Contributors"]

[workspace.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wayland", "x11", "wgpu"] }
egui = "0.37"
nalgebra = { version = "0.35", features = ["serde-serialize"] }
proptest = "1.12"
quick-xml = "0.41"
rayon = "1.10"
rfd = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "9.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
